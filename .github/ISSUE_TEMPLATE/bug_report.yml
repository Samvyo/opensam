name: Bug report
description: Something in one of the projects does not work as described
labels: ["bug"]
body:
  - type: dropdown
    id: project
    attributes:
      label: Project
      options:
        - full-mesh
        - mediasoup
        - v2ai
        - Repository or documentation
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. cd mediasoup
        2. docker compose up --build
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The relevant container or browser console output. Remove any API keys or tokens first.
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, Docker version, browser"
