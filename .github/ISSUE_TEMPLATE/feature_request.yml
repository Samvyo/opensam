name: Feature request
description: Suggest an improvement or a new capability
labels: ["enhancement"]
body:
  - type: dropdown
    id: project
    attributes:
      label: Project
      options:
        - full-mesh
        - mediasoup
        - v2ai
        - Repository or documentation
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you suggest
      description: How you would like it to work. Say if you would like to open the pull request yourself.
